# Prometheus — scrape Spring Boot on the host (no Docker)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: openproject-backend-host
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - localhost:8080
        labels:
          env: local
