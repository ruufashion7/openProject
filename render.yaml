# Render Blueprint — free Docker web service for the Spring Boot API.
# Dashboard: New → Blueprint → connect this repo, or add as Web Service from Dockerfile.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: openproject-backend
    runtime: docker
    plan: free
    # Keep MongoDB Atlas + optional Upstash Redis in the same cloud region when possible (e.g. AWS us-west / Oregon).
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      # Enables application-prod.properties (strict secrets, forward headers, Redis only if URL below is set).
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Redis is optional. Delete stale SPRING_DATA_REDIS_URL / REDIS_URL in the dashboard if deploy fails.
      # To enable: Upstash → Connect → TCP URL (rediss://default:...@....upstash.io:6380), then set OPENPROJECT_REDIS_ENABLED=true.
      - key: OPENPROJECT_REDIS_ENABLED
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECURITY_ENCRYPTION_KEY
        generateValue: true
      - key: SECURITY_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Shared with openproject-prometheus — Bearer token for /actuator/prometheus
      - key: METRICS_SCRAPE_TOKEN
        generateValue: true

  - type: web
    name: openproject-prometheus
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./monitoring/docker/prometheus/Dockerfile
    dockerContext: ./monitoring
    healthCheckPath: /-/healthy
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: openproject-backend
          property: host
      - key: METRICS_SCRAPE_TOKEN
        fromService:
          type: web
          name: openproject-backend
          property: envVar
          envVarKey: METRICS_SCRAPE_TOKEN

  - type: web
    name: openproject-grafana
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./monitoring/docker/grafana/Dockerfile
    dockerContext: ./monitoring
    healthCheckPath: /api/health
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        generateValue: true
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: PROMETHEUS_HOST
        fromService:
          type: web
          name: openproject-prometheus
          property: host
      - key: GRAFANA_PUBLIC_HOST
        fromService:
          type: web
          name: openproject-grafana
          property: host
