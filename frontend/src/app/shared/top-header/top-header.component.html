<header class="top-header">
  <div class="header-content">
    <div class="header-left">
      <button
        class="sidebar-toggle-btn"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="sidebarOpen"
        [attr.aria-label]="sidebarOpen ? 'Close navigation menu' : 'Open navigation menu'"
        [title]="sidebarOpen ? 'Close menu' : 'Open menu'"
      >
        <span class="toggle-icon" aria-hidden="true">{{ sidebarOpen ? '‹' : '☰' }}</span>
      </button>
      <div class="brand-section">
        <img
          class="brand-logo"
          src="assets/brand/burning-ice-logo.png"
          alt="BURNING ICE"
          width="499"
          height="317"
        />
        <div class="brand-text" aria-label="BURNING ICE, A Unit of RUU FASHION">
          <span class="brand-subtitle" *ngIf="pageTitle; else defaultSubtitle">{{ pageTitle }}</span>
          <ng-template #defaultSubtitle>
            <span class="brand-subtitle">A Unit of RUU FASHION</span>
          </ng-template>
        </div>
      </div>
    </div>
    
    <div class="header-right" *ngIf="displayName">
      <div class="session-wrapper">
        <app-session-banner />
      </div>
      
      <div class="user-section">
        <div class="user-avatar" [title]="displayName">
          <span>{{ displayName.charAt(0).toUpperCase() }}</span>
        </div>
        <div class="user-info">
          <div class="user-name" [title]="displayName">{{ displayName }}</div>
        </div>
      </div>
      
      <button 
        class="logout-btn" 
        (click)="logout()"
        title="Logout">
        <span class="logout-icon">🚪</span>
        <span class="logout-text">Logout</span>
      </button>
    </div>
  </div>
</header>
