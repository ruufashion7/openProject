<header class="app-header">
  <div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  </div>
  <div class="header-actions">
    <nav class="header-nav">
      <a routerLink="/welcome" routerLinkActive="active" class="btn btn-ghost">Welcome</a>
      <a routerLink="/upload" routerLinkActive="active" class="btn btn-ghost">Upload Files</a>
      <a routerLink="/sales-details" routerLinkActive="active" class="btn btn-ghost">Invoice Details</a>
      <a routerLink="/outstanding" routerLinkActive="active" class="btn btn-ghost">Details</a>
      <a routerLink="/outstanding-due" routerLinkActive="active" class="btn btn-ghost">Outstanding Due</a>
      <a
        *ngIf="permission.canAccessWhatsappBroadcast()"
        routerLink="/whatsapp-outreach"
        routerLinkActive="active"
        class="btn btn-ghost"
      >WhatsApp</a>
    </nav>
    <div class="session-logout-wrapper">
      <app-session-banner />
      <button type="button" class="btn btn-ghost" (click)="logout()" title="Sign out">Logout</button>
    </div>
  </div>
</header>
