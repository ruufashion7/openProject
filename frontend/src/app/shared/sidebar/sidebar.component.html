<aside class="sidebar" [class.is-open]="isOpen">
  <div class="sidebar-overlay" (click)="closeSidebar()" *ngIf="isOpen && isMobile"></div>
  <button
    type="button"
    class="sidebar-close-btn"
    (click)="closeSidebar()"
    aria-label="Close navigation"
    title="Close menu"
  >
    ×
  </button>
  <nav class="sidebar-nav" aria-label="Main navigation">
    <section
      class="nav-section"
      *ngFor="let section of navSections"
      [attr.aria-labelledby]="'nav-section-' + section.id"
    >
      <h2 class="nav-section-label" [id]="'nav-section-' + section.id">{{ section.label }}</h2>

      <ng-container *ngFor="let item of section.items">
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [class.active]="isParentActive(item)"
          [class.nav-item-group-active]="isGroupActive(item)"
          class="nav-item"
          [title]="item.label"
          (click)="closeSidebar()"
        >
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="nav-label" [title]="item.label">{{ item.label }}</span>
        </a>

        <div class="nav-subgroup" *ngIf="hasVisibleChildren(item)">
          <a
            *ngFor="let child of item.children"
            [routerLink]="child.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.active]="isActive(child.route)"
            class="nav-item nav-item-sub"
            [title]="child.label"
            (click)="closeSidebar()"
          >
            <span class="nav-icon nav-icon-sub" aria-hidden="true">{{ child.icon }}</span>
            <span class="nav-label" [title]="child.label">{{ child.label }}</span>
          </a>
        </div>
      </ng-container>
    </section>
  </nav>
</aside>
