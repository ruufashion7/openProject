<div class="app-container" [class.sidebar-open]="sidebarOpen" [class.sidebar-closed]="!sidebarOpen">
  <app-notification />
  <app-top-header *ngIf="showSidebar" />
  <app-sidebar *ngIf="showSidebar" />
  <main class="app-content" [class.with-sidebar]="showSidebar" [class.with-header]="showSidebar">
    <router-outlet />
  </main>
  <app-scroll-button />
</div>
