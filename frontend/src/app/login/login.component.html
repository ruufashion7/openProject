<section class="auth-page">
  <div class="card auth-card">
    <div class="auth-brand">
      <img
        src="assets/brand/burning-ice-logo.png"
        alt="BURNING ICE"
        class="auth-logo"
        width="499"
        height="317"
      />
      <p class="auth-tagline">A Unit of RUU FASHION</p>
    </div>
    <h1 class="page-title">Sign in</h1>
    <p class="page-subtitle">Enter your credentials to continue</p>

    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <label>
        Username
        <input
          name="username"
          [(ngModel)]="username"
          required
          autocomplete="username"
          [disabled]="loading"
          (paste)="blockClipboard($event)"
          (copy)="blockClipboard($event)"
          (cut)="blockClipboard($event)"
          (keydown)="blockClipboardShortcut($event)"
          (contextmenu)="blockContextMenu($event)"
          (drop)="blockDrop($event)"
        />
      </label>

      <label>
        Password
        <span class="password-field">
          <input
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            [disabled]="loading"
            (paste)="blockClipboard($event)"
            (copy)="blockClipboard($event)"
            (cut)="blockClipboard($event)"
            (keydown)="blockClipboardShortcut($event)"
            (contextmenu)="blockContextMenu($event)"
            (drop)="blockDrop($event)"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleShowPassword()"
            [disabled]="loading"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.title]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
          >
            <svg
              *ngIf="!showPassword"
              class="password-toggle-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
              />
            </svg>
            <svg
              *ngIf="showPassword"
              class="password-toggle-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-4 .71l2.17 2.17C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
              />
            </svg>
          </button>
        </span>
      </label>

      <p class="status-text muted" *ngIf="warmingUp && !loading && !error">Connecting to server…</p>
      <p class="status-text failed" *ngIf="error">{{ error }}</p>
      <p class="status-text muted" *ngIf="loading && !error">Signing in…</p>

      <button
        class="btn btn-primary login-submit"
        type="submit"
        [disabled]="!loginForm.valid || loading"
        [attr.aria-busy]="loading"
      >
        <span class="login-btn-inner" [class.is-loading]="loading">
          <span class="spinner" *ngIf="loading" aria-hidden="true"></span>
          <span>{{ loading ? 'Signing in…' : 'Login' }}</span>
        </span>
      </button>
    </form>
  </div>
</section>
