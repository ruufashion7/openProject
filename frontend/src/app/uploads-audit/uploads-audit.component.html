<section class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Upload Audit Trail</h1>
      <p class="page-subtitle">History of uploads — successful, stopped, cancelled, and failed attempts.</p>
    </div>
  </div>

  <div class="card">
    <div class="inline-actions">
      <a routerLink="/uploads" class="btn btn-ghost">Back to Latest</a>
      <a routerLink="/uploads-purge" class="btn btn-ghost">Hard Delete</a>
    </div>
    <app-page-state *ngIf="status === 'loading'" kind="loading" message="Loading audit trail..."></app-page-state>
    <app-page-state *ngIf="status === 'failed'" kind="error" [message]="message"></app-page-state>

    <table *ngIf="status === 'idle' && entries.length">
      <thead>
        <tr>
          <th>Action</th>
          <th>Type</th>
          <th>File</th>
          <th>Details</th>
          <th>When</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let entry of entries">
          <td>
            <span
              class="badge"
              [class.success]="entry.action === 'ADDED'"
              [class.warning]="entry.action === 'DELETED'"
              [class.stopped]="entry.action === 'STOPPED'"
              [class.cancelled]="entry.action === 'CANCELLED'"
              [class.failed]="entry.action === 'FAILED'"
            >
              {{ entry.action }}
            </span>
          </td>
          <td>
            <span class="badge type" [class.detailed]="entry.type === 'detailed'">
              {{ entry.type }}
            </span>
          </td>
          <td>{{ entry.originalFilename }}</td>
          <td class="detail-cell">{{ entry.message || '—' }}</td>
          <td>{{ entry.uploadedAt | date: 'medium' }}</td>
        </tr>
      </tbody>
    </table>

    <app-page-state *ngIf="status === 'idle' && !entries.length" kind="empty" message="No audit entries yet."></app-page-state>
  </div>
</section>
